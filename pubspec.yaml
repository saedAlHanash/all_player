name: all_player
description: Unified video player for Flutter supporting YouTube (IFrame & Player), Vimeo, Dailymotion, Network, Asset, and File with Cubit state management.
version: 1.0.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  m_cubit:
#    path: ../../packages/m_cubit
    git:
      url: https://github.com/saedAlHanash/m_cubit

  # services
  video_player: ^2.11.0
  http: ^1.6.0
  flutter_bloc: ^9.0.0
  wakelock_plus: ^1.4.0
  universal_html: ^2.3.0
  youtube_explode_dart: ^3.0.5
  youtube_player_flutter: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true