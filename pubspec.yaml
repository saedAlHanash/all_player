name: all_player
description: Unified video player for Flutter supporting YouTube (IFrame & Player), Vimeo, Dailymotion, Network, Asset, and File with Cubit state management.
version: 2.0.0

environment:
  sdk: ^3.12.2 # required by video_partial_cache

dependencies:
  flutter:
    sdk: flutter

  m_cubit:
#    path: ../../packages/m_cubit
    git:
      url: https://github.com/saedAlHanash/m_cubit

  video_partial_cache:
    git:
      url: https://github.com/saedAlHanash/video_partial_cache

  # services
  video_player: ^2.14.1
  http: ^1.6.0
  flutter_bloc: ^9.1.1
  wakelock_plus: ^1.8.2
  universal_html: ^2.3.0
  youtube_explode_dart: ^3.1.0
  youtube_player_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true